[package]
name = "reth-ethereum-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Ethereum primitive types"

[lints]
workspace = true

[dependencies]
# reth
reth-codecs = { workspace = true, optional = true, features = ["alloy"] }
reth-primitives-traits.workspace = true
reth-rpc-traits = { workspace = true, optional = true }

# ethereum
alloy-eips = { workspace = true, features = ["k256"] }
alloy-network = { workspace = true, optional = true }
alloy-primitives.workspace = true
alloy-evm.workspace = true
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-rpc-types-eth = { workspace = true, optional = true }
alloy-rlp.workspace = true
revm.workspace = true

# misc
arbitrary = { workspace = true, optional = true }
derive_more.workspace = true
rand_08 = { workspace = true, optional = true }
reth-zstd-compressors = { workspace = true, optional = true }
secp256k1 = { workspace = true, optional = true, features = ["rand"] }
serde = { workspace = true, optional = true }

[dev-dependencies]
arbitrary.workspace = true
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
rand.workspace = true
rand_08.workspace = true
secp256k1 = { workspace = true, features = ["rand"] }
alloy-rlp.workspace = true
reth-codecs = { workspace = true, features = ["test-utils"] }
reth-zstd-compressors.workspace = true
alloy-consensus = { workspace = true, features = ["serde", "arbitrary"] }
serde_json.workspace = true
serde_with.workspace = true

[features]
default = ["std"]
test-utils = [
    "reth-codecs?/test-utils",
    "reth-primitives-traits/test-utils",
]
std = [
    "alloy-consensus/std",
    "alloy-primitives/std",
    "reth-primitives-traits/std",
    "reth-primitives-traits/quanta",
    "serde?/std",
    "alloy-eips/std",
    "alloy-rpc-types-eth?/std",
    "alloy-rlp/std",
    "derive_more/std",
    "reth-zstd-compressors?/std",
    "serde_json/std",
    "serde_with/std",
    "reth-codecs?/std",
]
reth-codec = [
    "std",
    "dep:reth-codecs",
    "dep:reth-zstd-compressors",
]
arbitrary = [
    "std",
    "dep:arbitrary",
    "dep:rand_08",
    "dep:secp256k1",
    "alloy-consensus/arbitrary",
    "alloy-consensus/k256",
    "alloy-primitives/arbitrary",
    "reth-codecs?/arbitrary",
    "reth-primitives-traits/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-rpc-types-eth?/arbitrary",
]
serde = [
    "dep:serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "reth-codecs?/serde",
    "reth-primitives-traits/serde",
    "alloy-rpc-types-eth?/serde",
]
rpc = [
    "dep:alloy-rpc-types-eth",
    "dep:alloy-network",
    "dep:reth-rpc-traits",
    "alloy-rpc-types-eth?/serde",
]
