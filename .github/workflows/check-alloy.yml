# Checks reth compilation against alloy branches to detect breaking changes.
# Run on-demand via workflow_dispatch.

name: Check Alloy Breaking Changes

on:
  workflow_dispatch:
    inputs:
      alloy_branch:
        description: 'Branch/rev for alloy-rs/alloy (leave empty to skip)'
        required: false
        type: string
      alloy_evm_branch:
        description: 'Branch/rev for alloy-rs/evm (alloy-evm, alloy-op-evm) (leave empty to skip)'
        required: false
        type: string
      op_alloy_branch:
        description: 'Branch/rev for alloy-rs/op-alloy (leave empty to skip)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  check:
    name: Check compilation with patched alloy
    runs-on: ${{ github.repository == 'paradigmxyz/reth' && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - run: .github/scripts/install_llvm.sh ubuntu

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Configure Cargo Steward wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: Track Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: start
      - name: Apply alloy patches
        env:
          ALLOY_BRANCH: ${{ inputs.alloy_branch }}
          ALLOY_EVM_BRANCH: ${{ inputs.alloy_evm_branch }}
          OP_ALLOY_BRANCH: ${{ inputs.op_alloy_branch }}
        run: |
          ARGS=()
          if [ -n "$ALLOY_BRANCH" ]; then
            ARGS+=(--alloy "$ALLOY_BRANCH")
          fi
          if [ -n "$ALLOY_EVM_BRANCH" ]; then
            ARGS+=(--evm "$ALLOY_EVM_BRANCH")
          fi
          if [ -n "$OP_ALLOY_BRANCH" ]; then
            ARGS+=(--op "$OP_ALLOY_BRANCH")
          fi
          
          if [ "${#ARGS[@]}" -eq 0 ]; then
            echo "No branches specified, nothing to patch"
            exit 1
          fi
          
          ./scripts/patch-alloy.sh "${ARGS[@]}"
          
          echo "=== Final patch section ==="
          tail -50 Cargo.toml

      - name: Check workspace
        run: cargo clippy --workspace --lib --examples --tests --benches --all-features --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Trim Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: trim
          budget: 4GiB
