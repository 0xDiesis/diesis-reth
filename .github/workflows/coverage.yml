name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SEED: rustethereumethereumrust
  RUSTC_WRAPPER: sccache
  # Enable once the repository is public or the GitHub plan supports Pages publish.
  ENABLE_PAGES_PUBLISH: "false"

jobs:
  doublcov:
    name: Doublcov
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-gate.outputs.enabled }}
    steps:
      - name: Gate Pages publish
        id: pages-gate
        run: |
          if [ "${{ env.ENABLE_PAGES_PUBLISH }}" = "true" ] \
            && [ "${{ github.event_name }}" != "pull_request" ] \
            && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mold
        uses: rui314/setup-mold@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Doublcov
        uses: doublesharp/doublcov@v0
        with:
          version: latest
          install-only: "true"

      - name: Restore Doublcov history
        uses: actions/cache/restore@v5
        with:
          path: .doublcov/history.json
          key: doublcov-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            doublcov-history-${{ github.ref_name }}-
            doublcov-history-

      - name: Generate LCOV
        run: |
          make cov-unit
          mkdir -p coverage
          mv lcov.info coverage/lcov.info

      - name: Build Doublcov report
        run: doublcov build --lcov coverage/lcov.info --sources . --out coverage/report --mode static --no-open

      - name: Save Doublcov history
        if: always() && hashFiles('.doublcov/history.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .doublcov/history.json
          key: doublcov-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Doublcov report
        if: always() && hashFiles('coverage/report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: doublcov-report
          path: coverage/report
          if-no-files-found: error

      - name: Upload coverage data
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: doublcov-data
          path: |
            coverage/lcov.info
            .doublcov/history.json
          if-no-files-found: warn
          include-hidden-files: true

      - name: Prepare Pages artifact
        if: env.ENABLE_PAGES_PUBLISH == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('coverage/report/index.html') != ''
        run: |
          mkdir -p pages/coverage
          cp -R coverage/report/. pages/coverage/
          cat > pages/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>diesis-reth coverage</title>
          <script>location.replace("coverage/" + location.hash);</script>
          <meta http-equiv="refresh" content="0; url=coverage/">
          <a href="coverage/">diesis-reth coverage report</a>
          HTML

      - name: Upload Pages artifact
        if: env.ENABLE_PAGES_PUBLISH == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('pages/coverage/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Write summary
        if: always() && hashFiles('coverage/report/index.html') != ''
        run: |
          {
            echo "## Doublcov coverage"
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Download and extract the \`doublcov-report\` artifact, then preview it with \`doublcov open coverage/report\`."
            elif [ "${{ env.ENABLE_PAGES_PUBLISH }}" = "true" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "This run also publishes the report to GitHub Pages."
            fi
            echo
            echo "History is restored from and saved to the \`doublcov-history-*\` Actions cache keys."
          } >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Publish coverage page
    needs: doublcov
    if: needs.doublcov.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}coverage/
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write Pages summary
        run: |
          {
            echo "## Published coverage"
            echo
            echo "${{ steps.deployment.outputs.page_url }}coverage/"
          } >> "$GITHUB_STEP_SUMMARY"
